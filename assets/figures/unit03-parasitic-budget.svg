<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="u03-parasitic-budget-title u03-parasitic-budget-desc" data-figure-style="sts-flat-v1">
<title id="u03-parasitic-budget-title">寄生與探棒：同一節點的電容預算</title><desc id="u03-parasitic-budget-desc">理想源經2千歐電阻驅動Vo，20皮法設計電容、5皮法寄生、可移除的10皮法探棒都對同一交流參考並聯。固定線性時不變模型，不是SAR取樣。1MHz要求振幅比至少0.95且落後不超過18度，總電容上限25.85628788169206皮法由相位限制決定。20、25、35皮法依次為通過、通過、不通過，對應幅相0.9698388及負14.1078度、0.9540282及負17.4406度、0.9153748及負23.7410度。共同比例長條顯示未接探棒時只餘0.8562878816920616皮法。自設公式模型，非實測。</desc>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC","DejaVu Sans",sans-serif;font-variant-numeric:tabular-nums}</style>
<rect width="1200" height="1100" fill="#ffffff"/><text x="38" y="44" font-size="25" fill="#2e3d59" text-anchor="start" >寄生與探棒：同一節點的電容預算</text><line x1="38" y1="65" x2="1162" y2="65" stroke="#c5cfdd" stroke-width="2" /><circle cx="56" cy="108" r="18" fill="#7185a6" /><text x="56" y="115" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="87" y="116" font-size="22" fill="#2e3d59" text-anchor="start" >同一固定 LTI 節點：並聯電容必須算在一起</text><circle cx="110" cy="235" r="33" fill="#ffffff" stroke="#607b9e" stroke-width="2"/><path d="M 89 235 Q 99 213 110 235 T 131 235" fill="none" stroke="#2e3d59" stroke-width="2"/><text x="155" y="242" font-size="22" fill="#2e3d59" text-anchor="start" >Vs</text><line x1="110" y1="202" x2="110" y2="170" stroke="#2e3d59" stroke-width="2" /><line x1="110" y1="170" x2="240" y2="170" stroke="#2e3d59" stroke-width="2" /><rect x="240" y="145" width="180" height="50" fill="#91b3d4" stroke="#607b9e" stroke-width="1.5" /><text x="330" y="177" font-size="22" fill="#2e3d59" text-anchor="middle" >Rs = 2 kΩ</text><line x1="420" y1="170" x2="1090" y2="170" stroke="#2e3d59" stroke-width="2" /><text x="1090" y="137" font-size="22" fill="#2e3d59" text-anchor="end" >Vo</text><line x1="110" y1="268" x2="110" y2="350" stroke="#2e3d59" stroke-width="2" /><line x1="110" y1="350" x2="1000" y2="350" stroke="#2e3d59" stroke-width="2" /><line x1="110" y1="350" x2="110" y2="360" stroke="#2e3d59" stroke-width="2" /><line x1="92" y1="360" x2="128" y2="360" stroke="#2e3d59" stroke-width="2" /><line x1="98" y1="367" x2="122" y2="367" stroke="#2e3d59" stroke-width="2" /><line x1="104" y1="374" x2="116" y2="374" stroke="#2e3d59" stroke-width="2" /><rect x="940" y="145" width="214" height="225" fill="none" stroke="#607b9e" stroke-width="1.5" stroke-dasharray="7 5"/><g id="branch-c0" data-capacitance-pf="20" data-top-node="Vo" data-bottom-node="ac-reference"><circle cx="600" cy="170" r="4" fill="#2e3d59" /><line x1="600" y1="170" x2="600" y2="245" stroke="#2e3d59" stroke-width="2" /><line x1="570" y1="245" x2="630" y2="245" stroke="#2e3d59" stroke-width="2" /><line x1="570" y1="260" x2="630" y2="260" stroke="#2e3d59" stroke-width="2" /><line x1="600" y1="260" x2="600" y2="350" stroke="#2e3d59" stroke-width="2" /><circle cx="600" cy="350" r="4" fill="#2e3d59" /><text x="643" y="237" font-size="22" fill="#2e3d59" text-anchor="start" >C₀</text><text x="643" y="273" font-size="20" fill="#536781" text-anchor="start" >20 pF</text></g><g id="branch-parasitic" data-capacitance-pf="5" data-top-node="Vo" data-bottom-node="ac-reference"><circle cx="800" cy="170" r="4" fill="#2e3d59" /><line x1="800" y1="170" x2="800" y2="245" stroke="#2e3d59" stroke-width="2" /><line x1="770" y1="245" x2="830" y2="245" stroke="#2e3d59" stroke-width="2" /><line x1="770" y1="260" x2="830" y2="260" stroke="#2e3d59" stroke-width="2" /><line x1="800" y1="260" x2="800" y2="350" stroke="#2e3d59" stroke-width="2" /><circle cx="800" cy="350" r="4" fill="#2e3d59" /><text x="843" y="237" font-size="22" fill="#2e3d59" text-anchor="start" >寄生</text><text x="843" y="273" font-size="20" fill="#536781" text-anchor="start" >5 pF</text></g><g id="branch-probe" data-capacitance-pf="10" data-top-node="Vo" data-bottom-node="ac-reference"><circle cx="1000" cy="170" r="4" fill="#2e3d59" /><line x1="1000" y1="170" x2="1000" y2="245" stroke="#2e3d59" stroke-width="2" /><line x1="970" y1="245" x2="1030" y2="245" stroke="#2e3d59" stroke-width="2" /><line x1="970" y1="260" x2="1030" y2="260" stroke="#2e3d59" stroke-width="2" /><line x1="1000" y1="260" x2="1000" y2="350" stroke="#2e3d59" stroke-width="2" /><circle cx="1000" cy="350" r="4" fill="#2e3d59" /><text x="1043" y="237" font-size="22" fill="#2e3d59" text-anchor="start" >探棒</text><text x="1043" y="273" font-size="20" fill="#536781" text-anchor="start" >10 pF</text></g><text x="1047" y="397" font-size="20" fill="#536781" text-anchor="middle" >虛框：可移除探棒</text><text x="600" y="435" font-size="20" fill="#536781" text-anchor="middle" >各電容同接 Vo 與交流共同參考；接上探棒會改變被測模型。</text><text x="600" y="467" font-size="20" fill="#536781" text-anchor="middle" >下方由設計值逐項加入寄生與探棒；不是 SAR 開關取樣。</text><line x1="38" y1="490" x2="1162" y2="490" stroke="#c5cfdd" stroke-width="2" /><circle cx="56" cy="530" r="18" fill="#7185a6" /><text x="56" y="537" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="87" y="538" font-size="22" fill="#2e3d59" text-anchor="start" >同一比例的電容預算：已接近上限</text><text x="600" y="579" font-size="22" fill="#2e3d59" text-anchor="middle" >1 MHz：|Vo/Vs| ≥ 0.95，落後角 ≤ 18°；兩項都要通過。</text><line x1="330" y1="625" x2="330" y2="880" stroke="#c5cfdd" stroke-width="2" shape-rendering="crispEdges"/><text x="330" y="914" font-size="20" fill="#536781" text-anchor="middle" >0</text><line x1="515" y1="625" x2="515" y2="880" stroke="#c5cfdd" stroke-width="2" shape-rendering="crispEdges"/><text x="515" y="914" font-size="20" fill="#536781" text-anchor="middle" >10</text><line x1="700" y1="625" x2="700" y2="880" stroke="#c5cfdd" stroke-width="2" shape-rendering="crispEdges"/><text x="700" y="914" font-size="20" fill="#536781" text-anchor="middle" >20</text><line x1="885" y1="625" x2="885" y2="880" stroke="#c5cfdd" stroke-width="2" shape-rendering="crispEdges"/><text x="885" y="914" font-size="20" fill="#536781" text-anchor="middle" >30</text><line x1="1070" y1="625" x2="1070" y2="880" stroke="#c5cfdd" stroke-width="2" shape-rendering="crispEdges"/><text x="1070" y="914" font-size="20" fill="#536781" text-anchor="middle" >40</text><line x1="330" y1="880" x2="1070" y2="880" stroke="#2e3d59" stroke-width="2" /><text x="1085" y="946" font-size="20" fill="#536781" text-anchor="end" >總電容（pF）</text><g id="budget-design" data-total-pf="20" data-gain="0.9698388315126839" data-phase-deg="-14.107802371590129"><text x="70" y="670" font-size="22" fill="#2e3d59" text-anchor="start" >設計值：20 pF</text><rect x="330.000" y="640" width="370.000" height="46" fill="#c4d5e7" stroke="#607b9e" stroke-width="1.5" id="budget-design-c0" data-start-pf="0" data-capacitance-pf="20"/><text x="515" y="671" font-size="22" fill="#2e3d59" text-anchor="middle" >20</text><text x="1140" y="671" font-size="22" fill="#2e3d59" text-anchor="end" >通過</text></g><g id="budget-built" data-total-pf="25" data-gain="0.954028216378465" data-phase-deg="-17.44059449051187"><text x="70" y="760" font-size="22" fill="#2e3d59" text-anchor="start" >含寄生：25 pF</text><rect x="330.000" y="730" width="370.000" height="46" fill="#c4d5e7" stroke="#607b9e" stroke-width="1.5" id="budget-built-c0" data-start-pf="0" data-capacitance-pf="20"/><text x="515" y="761" font-size="22" fill="#2e3d59" text-anchor="middle" >20</text><rect x="700.000" y="730" width="92.500" height="46" fill="#91b3d4" stroke="#607b9e" stroke-width="1.5" id="budget-built-parasitic" data-start-pf="20" data-capacitance-pf="5"/><text x="746.25" y="761" font-size="22" fill="#2e3d59" text-anchor="middle" >5</text><text x="1140" y="761" font-size="22" fill="#2e3d59" text-anchor="end" >通過</text></g><g id="budget-probed" data-total-pf="35" data-gain="0.9153747583327411" data-phase-deg="-23.740996128556265"><text x="70" y="850" font-size="22" fill="#2e3d59" text-anchor="start" >加探棒：35 pF</text><rect x="330.000" y="820" width="370.000" height="46" fill="#c4d5e7" stroke="#607b9e" stroke-width="1.5" id="budget-probed-c0" data-start-pf="0" data-capacitance-pf="20"/><text x="515" y="851" font-size="22" fill="#2e3d59" text-anchor="middle" >20</text><rect x="700.000" y="820" width="92.500" height="46" fill="#91b3d4" stroke="#607b9e" stroke-width="1.5" id="budget-probed-parasitic" data-start-pf="20" data-capacitance-pf="5"/><text x="746.25" y="851" font-size="22" fill="#2e3d59" text-anchor="middle" >5</text><rect x="792.500" y="820" width="185.000" height="46" fill="#edaa60" stroke="#607b9e" stroke-width="1.5" id="budget-probed-probe" data-start-pf="25" data-capacitance-pf="10"/><text x="885" y="851" font-size="22" fill="#2e3d59" text-anchor="middle" >10</text><text x="1140" y="851" font-size="22" fill="#b56b28" text-anchor="end" >不通過</text></g><line x1="808.341" y1="617" x2="808.341" y2="880" stroke="#2e3d59" stroke-width="2" id="capacitance-limit" data-capacitance-pf="25.85628788169206" data-gain-limit-pf="26.155850027476255" data-phase-limit-pf="25.85628788169206" stroke-dasharray="3 5"/><text x="808.3413258113031" y="610" font-size="20" fill="#2e3d59" text-anchor="middle" >上限 25.8563 pF</text><text x="600" y="982" font-size="22" fill="#2e3d59" text-anchor="middle" >未接探棒已用 25 pF；到較嚴的相位上限只剩 0.8563 pF。</text><text x="600" y="1024" font-size="20" fill="#536781" text-anchor="middle" >淺藍：C₀；深藍：寄生；橘色：探棒。長條共用零點及每 pF 長度。</text><text x="600" y="1068" font-size="20" fill="#536781" text-anchor="middle" >自設固定參數模型；不是實測、完整電路或容差保證。</text></svg>
