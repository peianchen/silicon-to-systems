<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="u02-acq-window-title u02-acq-window-desc" data-figure-style="sts-flat-v1">
<title id="u02-acq-window-title">取樣建立：先定義窗口，再判斷誤差</title><desc id="u02-acq-window-desc">原創單極點模型。輸入經含導通阻抗的等效電阻和理想開關充電保持電容。追蹤結束前檢查建立差，後面的保持轉換不算入追蹤窗。10位元、2.048伏跨度給2毫伏間隔，本例單獨將1毫伏分配給建立項。事件時間不按比例，非實際完整ADC。</desc>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC","DejaVu Sans",sans-serif;font-variant-numeric:tabular-nums}</style>
<rect width="1200" height="900" fill="#ffffff"/><text x="38" y="44" font-size="25" fill="#2e3d59" text-anchor="start" >取樣建立：先定義窗口，再判斷誤差</text><line x1="38" y1="65" x2="1162" y2="65" stroke="#c5cfdd" stroke-width="2" /><circle cx="56" cy="108" r="18" fill="#7185a6" /><text x="56" y="115" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="87" y="116" font-size="22" fill="#2e3d59" text-anchor="start" >有效追蹤期間：只取一個等效充電狀態</text><circle cx="110" cy="220" r="35" fill="#ffffff" stroke="#607b9e" stroke-width="2"/><text x="110" y="228" font-size="22" fill="#2e3d59" text-anchor="middle" >Vin</text><line x1="145" y1="220" x2="230" y2="220" stroke="#2e3d59" stroke-width="2" /><rect x="230" y="195" width="180" height="50" rx="3" fill="#91b3d4" stroke="#607b9e" stroke-width="2"/><text x="320" y="227" font-size="22" fill="#2e3d59" text-anchor="middle" >R_eq</text><line x1="410" y1="220" x2="530" y2="220" stroke="#2e3d59" stroke-width="2" /><circle cx="530" cy="220" r="4" fill="#2e3d59" /><line x1="530" y1="220" x2="610" y2="220" stroke="#2e3d59" stroke-width="2" /><circle cx="610" cy="220" r="4" fill="#2e3d59" /><line x1="610" y1="220" x2="790" y2="220" stroke="#2e3d59" stroke-width="2" /><circle cx="790" cy="220" r="4" fill="#2e3d59" /><text x="570" y="183" font-size="20" fill="#536781" text-anchor="middle" >理想開關：追蹤時接通</text><line x1="790" y1="220" x2="1035" y2="220" stroke="#2e3d59" stroke-width="2" /><text x="1020" y="192" font-size="22" fill="#2e3d59" text-anchor="middle" >保持節點 v_H</text><line x1="790" y1="220" x2="790" y2="280" stroke="#2e3d59" stroke-width="2" /><line x1="750" y1="280" x2="830" y2="280" stroke="#2e3d59" stroke-width="2" /><line x1="750" y1="296" x2="830" y2="296" stroke="#2e3d59" stroke-width="2" /><line x1="790" y1="296" x2="790" y2="330" stroke="#2e3d59" stroke-width="2" /><line x1="790" y1="330" x2="790" y2="340" stroke="#2e3d59" stroke-width="2" /><line x1="772" y1="340" x2="808" y2="340" stroke="#2e3d59" stroke-width="2" /><line x1="778" y1="347" x2="802" y2="347" stroke="#2e3d59" stroke-width="2" /><line x1="784" y1="354" x2="796" y2="354" stroke="#2e3d59" stroke-width="2" /><text x="875" y="292" font-size="22" fill="#2e3d59" text-anchor="start" >C_H</text><line x1="110" y1="255" x2="110" y2="330" stroke="#2e3d59" stroke-width="2" /><line x1="110" y1="330" x2="110" y2="340" stroke="#2e3d59" stroke-width="2" /><line x1="92" y1="340" x2="128" y2="340" stroke="#2e3d59" stroke-width="2" /><line x1="98" y1="347" x2="122" y2="347" stroke="#2e3d59" stroke-width="2" /><line x1="104" y1="354" x2="116" y2="354" stroke="#2e3d59" stroke-width="2" /><text x="320" y="280" font-size="20" fill="#536781" text-anchor="middle" >源與導通阻抗已含在 R_eq</text><text x="600" y="390" font-size="20" fill="#536781" text-anchor="middle" >固定 R、C，輸入已到新值；忽略非線性與回擾。</text><line x1="38" y1="415" x2="1162" y2="415" stroke="#c5cfdd" stroke-width="2" /><circle cx="56" cy="455" r="18" fill="#7185a6" /><text x="56" y="462" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="87" y="463" font-size="22" fill="#2e3d59" text-anchor="start" >同一筆資料的事件順序（時間長度不按比例）</text><rect x="140" y="510" width="560" height="70" rx="3" fill="#c4d5e7" stroke="#607b9e" stroke-width="2"/><rect x="700" y="510" width="420" height="70" rx="3" fill="#edaa60" stroke="#607b9e" stroke-width="2"/><text x="420" y="540" font-size="22" fill="#2e3d59" text-anchor="middle" >有效追蹤／充電</text><text x="420" y="568" font-size="20" fill="#536781" text-anchor="middle" >t_acq</text><text x="910" y="540" font-size="22" fill="#2e3d59" text-anchor="middle" >保持／轉換</text><text x="910" y="568" font-size="20" fill="#2e3d59" text-anchor="middle" >不補回已結束的追蹤時間</text><line x1="140" y1="495" x2="140" y2="600" stroke="#4c6d96" stroke-width="2" stroke-dasharray="5 5"/><line x1="700" y1="490" x2="700" y2="610" stroke="#b56b28" stroke-width="2" stroke-dasharray="5 5"/><text x="140" y="630" font-size="20" fill="#536781" text-anchor="start" >有效建立開始</text><text x="700" y="630" font-size="20" fill="#b56b28" text-anchor="middle" >此刻前檢查 E ≤ 1 mV</text><line x1="38" y1="660" x2="1162" y2="660" stroke="#c5cfdd" stroke-width="2" /><circle cx="56" cy="704" r="18" fill="#7185a6" /><text x="56" y="711" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="87" y="712" font-size="22" fill="#2e3d59" text-anchor="start" >同一個 10 位元示範：只分配建立項</text><rect x="70" y="745" width="310" height="88" rx="3" fill="#e4eaf2" stroke="#607b9e" stroke-width="2"/><text x="225" y="780" font-size="22" fill="#2e3d59" text-anchor="middle" >輸入跨度</text><text x="225" y="814" font-size="22" fill="#2e3d59" text-anchor="middle" >2.048 V</text><rect x="445" y="745" width="310" height="88" rx="3" fill="#c4d5e7" stroke="#607b9e" stroke-width="2"/><text x="600" y="780" font-size="22" fill="#2e3d59" text-anchor="middle" >量化間隔 q</text><text x="600" y="814" font-size="22" fill="#2e3d59" text-anchor="middle" >2 mV</text><rect x="820" y="745" width="310" height="88" rx="3" fill="#faead7" stroke="#607b9e" stroke-width="2"/><text x="975" y="780" font-size="22" fill="#2e3d59" text-anchor="middle" >建立項允許差</text><text x="975" y="814" font-size="22" fill="#2e3d59" text-anchor="middle" >q／2 = 1 mV</text><text x="600" y="873" font-size="20" fill="#536781" text-anchor="middle" >自設模型；不是完整 ADC 準確度、實測結果或實際版圖。</text></svg>
