<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="u03-voltage-title u03-voltage-desc" data-figure-style="sts-flat-v1"><title id="u03-voltage-title">KVL 相加的是電壓相量，不是電壓大小</title><desc id="u03-voltage-desc">兩軸每V500像素。VR自原點到(0.283043,0.450477)，VC再接至(1,0)，相加為電源電壓。相量大小0.532018與0.846733不能直接相加。計算圖非實測。</desc><defs><marker id="u03-voltage-ink" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#2e3d59"/></marker><marker id="u03-voltage-blue" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#4c6d96"/></marker><marker id="u03-voltage-orange" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#b56b28"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC","DejaVu Sans",sans-serif;font-variant-numeric:tabular-nums}line,path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="800" fill="#ffffff"/><text x="40" y="44" font-size="25" fill="#2e3d59" text-anchor="start">KVL 相加的是電壓相量，不是電壓大小</text><text x="40" y="82" font-size="20" fill="#536781" text-anchor="start">1 V RMS、1 kHz、1 kΩ、100 nF；所有電壓用同一個相位參考。</text><line x1="805" y1="110" x2="805" y2="675" stroke="#c5cfdd" stroke-width="1.5" /><line x1="275" y1="190" x2="275" y2="495" stroke="#c5cfdd" stroke-width="1.5" /><text x="275" y="527" font-size="20" fill="#536781" text-anchor="middle">0.25</text><line x1="400" y1="190" x2="400" y2="495" stroke="#c5cfdd" stroke-width="1.5" /><text x="400" y="527" font-size="20" fill="#536781" text-anchor="middle">0.5</text><line x1="525" y1="190" x2="525" y2="495" stroke="#c5cfdd" stroke-width="1.5" /><text x="525" y="527" font-size="20" fill="#536781" text-anchor="middle">0.75</text><line x1="650" y1="190" x2="650" y2="495" stroke="#c5cfdd" stroke-width="1.5" /><text x="650" y="527" font-size="20" fill="#536781" text-anchor="middle">1</text><line x1="150" y1="370" x2="720" y2="370" stroke="#c5cfdd" stroke-width="1.5" /><text x="133" y="377" font-size="20" fill="#536781" text-anchor="end">0.25</text><line x1="150" y1="245" x2="720" y2="245" stroke="#c5cfdd" stroke-width="1.5" /><text x="133" y="252" font-size="20" fill="#536781" text-anchor="end">0.5</text><line x1="80" y1="495" x2="745" y2="495" stroke="#2e3d59" stroke-width="1.5" /><line x1="150" y1="580" x2="150" y2="172" stroke="#2e3d59" stroke-width="1.5" /><text x="76" y="153" font-size="20" fill="#536781" text-anchor="start">Im V（V）</text><text x="740" y="607" font-size="20" fill="#536781" text-anchor="end">Re V（V）</text><text x="133" y="523" font-size="20" fill="#536781" text-anchor="end">0</text><path id="u03-voltage-VR" d="M150,495 L291.522,269.761" fill="none" stroke="#4c6d96" stroke-width="2.6" marker-end="url(#u03-voltage-blue)"/><path id="u03-voltage-VC" d="M291.522,269.761 L650,495" fill="none" stroke="#b56b28" stroke-width="2.6" marker-end="url(#u03-voltage-orange)"/><path id="u03-voltage-VS" d="M150,495 L650,495" fill="none" stroke="#2e3d59" stroke-width="2.6" marker-end="url(#u03-voltage-ink)"/><text x="302" y="226" font-size="20" fill="#2e3d59" text-anchor="start">(0.283043, +0.450477) V</text><text x="185" y="350" font-size="22" fill="#4c6d96" text-anchor="start">V_R</text><text x="496" y="355" font-size="22" fill="#b56b28" text-anchor="start">V_C</text><text x="430" y="463" font-size="22" fill="#2e3d59" text-anchor="middle">V_s = 1∠0° V</text><text x="650" y="566" font-size="20" fill="#2e3d59" text-anchor="middle">(1, 0) V</text><text x="65" y="649" font-size="20" fill="#536781" text-anchor="start">實部與虛部的伏特刻度相同。</text><text x="835" y="151" font-size="22" fill="#2e3d59" text-anchor="start">同頻率、RMS 相量</text><text x="835" y="203" font-size="22" fill="#4c6d96" text-anchor="start">|V_R| = 0.5320 V</text><text x="835" y="240" font-size="22" fill="#4c6d96" text-anchor="start">∠V_R = +57.86°</text><text x="835" y="298" font-size="22" fill="#b56b28" text-anchor="start">|V_C| = 0.8467 V</text><text x="835" y="335" font-size="22" fill="#b56b28" text-anchor="start">∠V_C = −32.14°</text><text x="835" y="395" font-size="22" fill="#2e3d59" text-anchor="start">V_R + V_C = V_s</text><text x="835" y="438" font-size="20" fill="#2e3d59" text-anchor="start">實部：0.283043 + 0.716957</text><text x="835" y="470" font-size="20" fill="#2e3d59" text-anchor="start">虛部：0.450477 − 0.450477</text><text x="835" y="510" font-size="20" fill="#2e3d59" text-anchor="start">得到 1 + j0 V。</text><text x="835" y="584" font-size="20" fill="#b56b28" text-anchor="start">0.5320 + 0.8467 ≠ 1</text><text x="835" y="624" font-size="20" fill="#b56b28" text-anchor="start">大小相加不是 KVL。</text><text x="40" y="723" font-size="20" fill="#2e3d59" text-anchor="start">橘色 V_C 從藍色 V_R 終點接出；向量平移不改變方向與大小。</text><text x="40" y="763" font-size="20" fill="#536781" text-anchor="start">圖形由複數分量計算，非實測；合向量的虛部為零。</text></svg>
