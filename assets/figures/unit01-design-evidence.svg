<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="u01-design-title u01-design-desc" data-figure-style="sts-flat-v1">
<title id="u01-design-title">從設計表示到交付：每種檢查回答不同問題</title><desc id="u01-design-desc">共同規格與PDK支援類比電路、版圖、寄生後性能，及數位RTL、合成、實體與時序路徑。兩路整合後按約定簽核並交付受控資料。橘色虛線為不符時回修；DFT、封裝與系統介面提早規劃。流程為典型教學整理，非完整工具操作或實物製程。</desc>
<defs><marker id="u01-design-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#4c6d96"/></marker><marker id="u01-design-orange" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#b56b28"/></marker></defs>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC","DejaVu Sans",sans-serif;font-variant-numeric:tabular-nums}</style>
<rect width="1200" height="860" fill="#ffffff"/><text x="38" y="44" font-size="25" fill="#2e3d59" text-anchor="start" >從設計表示到交付：每種檢查回答不同問題</text><line x1="38" y1="65" x2="1162" y2="65" stroke="#c5cfdd" stroke-width="2" /><rect x="90" y="88" width="1020" height="82" rx="3" fill="#eef2f7" stroke="#607b9e" stroke-width="2" /><text x="600" y="120" font-size="22" fill="#2e3d59" text-anchor="middle" >共同輸入：需求／介面、製程模型與規則、可用元件庫</text><text x="600" y="151" font-size="20" fill="#536781" text-anchor="middle" >功能、電壓、時間、電源與測試條件必須相容</text><line x1="315" y1="207" x2="315" y2="221" stroke="#4c6d96" stroke-width="2" marker-end="url(#u01-design-blue)"/><line x1="885" y1="207" x2="885" y2="221" stroke="#4c6d96" stroke-width="2" marker-end="url(#u01-design-blue)"/><text x="315" y="200" font-size="20" fill="#2e3d59" text-anchor="middle" >類比／混合訊號路徑</text><text x="885" y="200" font-size="20" fill="#2e3d59" text-anchor="middle" >數位邏輯路徑</text><rect x="90" y="225" width="450" height="80" rx="3" fill="#c4d5e7" stroke="#607b9e" stroke-width="2" /><circle cx="117" cy="251" r="18" fill="#7185a6"/><text x="117" y="258" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="335" y="257" font-size="22" fill="#2e3d59" text-anchor="middle" >電路圖與性能模擬</text><text x="335" y="288" font-size="20" fill="#536781" text-anchor="middle" >工作點／增益／建立時間</text><line x1="315" y1="307" x2="315" y2="340" stroke="#4c6d96" stroke-width="2" marker-end="url(#u01-design-blue)"/><rect x="90" y="345" width="450" height="80" rx="3" fill="#c4d5e7" stroke="#607b9e" stroke-width="2" /><circle cx="117" cy="371" r="18" fill="#7185a6"/><text x="117" y="378" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="335" y="377" font-size="22" fill="#2e3d59" text-anchor="middle" >元件配置與版圖</text><text x="335" y="408" font-size="20" fill="#536781" text-anchor="middle" >匹配／連接／幾何</text><line x1="315" y1="427" x2="315" y2="460" stroke="#4c6d96" stroke-width="2" marker-end="url(#u01-design-blue)"/><rect x="90" y="465" width="450" height="80" rx="3" fill="#e4eaf2" stroke="#607b9e" stroke-width="2" /><circle cx="117" cy="491" r="18" fill="#7185a6"/><text x="117" y="498" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="335" y="497" font-size="22" fill="#2e3d59" text-anchor="middle" >寄生後性能與實體檢查</text><text x="335" y="528" font-size="20" fill="#536781" text-anchor="middle" >DRC／LVS／PEX 等</text><rect x="660" y="225" width="450" height="80" rx="3" fill="#c4d5e7" stroke="#607b9e" stroke-width="2" /><circle cx="687" cy="251" r="18" fill="#7185a6"/><text x="687" y="258" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="905" y="257" font-size="22" fill="#2e3d59" text-anchor="middle" >RTL 與功能驗證</text><text x="905" y="288" font-size="20" fill="#536781" text-anchor="middle" >狀態／控制／資料有效</text><line x1="885" y1="307" x2="885" y2="340" stroke="#4c6d96" stroke-width="2" marker-end="url(#u01-design-blue)"/><rect x="660" y="345" width="450" height="80" rx="3" fill="#c4d5e7" stroke="#607b9e" stroke-width="2" /><circle cx="687" cy="371" r="18" fill="#7185a6"/><text x="687" y="378" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="905" y="377" font-size="22" fill="#2e3d59" text-anchor="middle" >合成網表與實體實作</text><text x="905" y="408" font-size="20" fill="#536781" text-anchor="middle" >佈局／時脈／繞線</text><line x1="885" y1="427" x2="885" y2="460" stroke="#4c6d96" stroke-width="2" marker-end="url(#u01-design-blue)"/><rect x="660" y="465" width="450" height="80" rx="3" fill="#e4eaf2" stroke="#607b9e" stroke-width="2" /><circle cx="687" cy="491" r="18" fill="#7185a6"/><text x="687" y="498" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="905" y="497" font-size="22" fill="#2e3d59" text-anchor="middle" >時序與實體檢查</text><text x="905" y="528" font-size="20" fill="#536781" text-anchor="middle" >約束／寄生／規則／連接</text><path d="M90 505 H53 V265 H87" fill="none" stroke="#b56b28" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#u01-design-orange)"/><path d="M1110 505 H1147 V265 H1113" fill="none" stroke="#b56b28" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#u01-design-orange)"/><text x="28" y="400" font-size="20" fill="#b56b28" text-anchor="middle" transform="rotate(-90 28 400)">不符則回修</text><text x="1175" y="400" font-size="20" fill="#b56b28" text-anchor="middle" transform="rotate(-90 1175 400)">不符則回修</text><path d="M315 548 V592 H600 V630" fill="none" stroke="#4c6d96" stroke-width="2" stroke-linejoin="round" marker-end="url(#u01-design-blue)"/><path d="M885 548 V592 H600" fill="none" stroke="#4c6d96" stroke-width="2" stroke-linejoin="round" /><rect x="240" y="635" width="720" height="88" rx="3" fill="#eef2f7" stroke="#607b9e" stroke-width="2" /><text x="600" y="670" font-size="22" fill="#2e3d59" text-anchor="middle" >混合訊號整合 → 約定簽核 → 受控資料交付</text><text x="600" y="703" font-size="20" fill="#536781" text-anchor="middle" >同版設計、模型、約束與報告；不等於已製成晶片</text><line x1="90" y1="754" x2="1110" y2="754" stroke="#c5cfdd" stroke-width="2" /><text x="600" y="790" font-size="22" fill="#2e3d59" text-anchor="middle" >DFT、封裝與系統介面：設計前期就共同規劃</text><line x1="125" y1="825" x2="175" y2="825" stroke="#4c6d96" stroke-width="2" marker-end="url(#u01-design-blue)"/><text x="190" y="833" font-size="20" fill="#536781" text-anchor="start" >資料依賴</text><line x1="450" y1="825" x2="500" y2="825" stroke="#b56b28" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#u01-design-orange)"/><text x="515" y="833" font-size="20" fill="#536781" text-anchor="start" >修訂回饋</text><text x="800" y="833" font-size="20" fill="#536781" text-anchor="start" >非單次、完整工具流程</text></svg>
