<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="u01-architecture-title u01-architecture-desc" data-figure-style="sts-flat-v1">
<title id="u01-architecture-title">晶片邊界與介面：功能齊全，不代表整合正確</title><desc id="u01-architecture-desc">候選IC整合AFE、ADC及數位控制介面；感測器、MCU與儲存留在外部。下方共同時間尺每毫秒500像素，0.8毫秒就緒、0.5毫秒轉換、0.2毫秒讀存合計1.5毫秒，2毫秒預算餘0.5毫秒。0.2毫秒啟動時尚不保證就緒。上限排程為自設，非實測。</desc>
<defs><marker id="u01-architecture-blue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#4c6d96"/></marker><marker id="u01-architecture-orange" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#b56b28"/></marker></defs>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC","DejaVu Sans",sans-serif;font-variant-numeric:tabular-nums}</style>
<rect width="1200" height="820" fill="#ffffff"/><text x="38" y="44" font-size="25" fill="#2e3d59" text-anchor="start" >晶片邊界與介面：功能齊全，不代表整合正確</text><line x1="38" y1="65" x2="1162" y2="65" stroke="#c5cfdd" stroke-width="2" /><circle cx="56" cy="108" r="18" fill="#7185a6"/><text x="56" y="115" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="87" y="116" font-size="22" fill="#2e3d59" text-anchor="start" >功能分割：虛線框內是候選 IC</text><rect x="278" y="145" width="610" height="216" rx="3" fill="#eef2f7" stroke="#607b9e" stroke-width="2" stroke-dasharray="9 7"/><text x="582" y="173" font-size="20" fill="#536781" text-anchor="middle" >候選混合訊號 IC（非實際版圖）</text><rect x="38" y="202" width="185" height="85" rx="3" fill="#e4eaf2" stroke="#607b9e" stroke-width="2" /><text x="130.5" y="235" font-size="22" fill="#2e3d59" text-anchor="middle" >感測元件</text><text x="130.5" y="268" font-size="20" fill="#536781" text-anchor="middle" >IC 外部</text><rect x="305" y="202" width="165" height="85" rx="3" fill="#91b3d4" stroke="#607b9e" stroke-width="2" /><text x="387.5" y="235" font-size="22" fill="#2e3d59" text-anchor="middle" >類比前端</text><text x="387.5" y="268" font-size="20" fill="#536781" text-anchor="middle" >AFE</text><rect x="510" y="202" width="125" height="85" rx="3" fill="#c4d5e7" stroke="#607b9e" stroke-width="2" /><text x="572.5" y="235" font-size="22" fill="#2e3d59" text-anchor="middle" >ADC</text><text x="572.5" y="268" font-size="20" fill="#536781" text-anchor="middle" >轉換</text><rect x="675" y="202" width="185" height="85" rx="3" fill="#c4d5e7" stroke="#607b9e" stroke-width="2" /><text x="767.5" y="235" font-size="22" fill="#2e3d59" text-anchor="middle" >數位控制</text><text x="767.5" y="268" font-size="20" fill="#536781" text-anchor="middle" >介面／狀態</text><rect x="950" y="202" width="210" height="85" rx="3" fill="#e4eaf2" stroke="#607b9e" stroke-width="2" /><text x="1055" y="235" font-size="22" fill="#2e3d59" text-anchor="middle" >MCU＋儲存</text><text x="1055" y="268" font-size="20" fill="#536781" text-anchor="middle" >IC 外部</text><line x1="223" y1="241" x2="301" y2="241" stroke="#4c6d96" stroke-width="2" marker-end="url(#u01-architecture-blue)"/><line x1="470" y1="241" x2="505" y2="241" stroke="#4c6d96" stroke-width="2" marker-end="url(#u01-architecture-blue)"/><line x1="635" y1="241" x2="670" y2="241" stroke="#4c6d96" stroke-width="2" marker-end="url(#u01-architecture-blue)"/><line x1="860" y1="241" x2="945" y2="241" stroke="#4c6d96" stroke-width="2" marker-end="url(#u01-architecture-blue)"/><text x="915" y="221" font-size="20" fill="#536781" text-anchor="middle" >結果</text><path d="M1055 290 V323 H767 V290" fill="none" stroke="#4c6d96" stroke-width="2" stroke-linejoin="round" marker-end="url(#u01-architecture-blue)"/><text x="1025" y="351" font-size="20" fill="#536781" text-anchor="middle" >控制命令</text><text x="600" y="402" font-size="20" fill="#536781" text-anchor="middle" >共同約束：供電、參考、時脈、熱與測試；RF 選配，這裡省略。</text><line x1="38" y1="432" x2="1162" y2="432" stroke="#c5cfdd" stroke-width="2" /><circle cx="56" cy="473" r="18" fill="#7185a6"/><text x="56" y="480" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="87" y="481" font-size="22" fill="#2e3d59" text-anchor="start" >依序時間預算：同一組條件，各段採上限串接</text><rect x="100" y="525" width="400" height="65" rx="3" fill="#91b3d4" stroke="#607b9e" stroke-width="2" id="budget-ready" data-start-ms="0" data-duration-ms="0.8"/><text x="300" y="553" font-size="20" fill="#2e3d59" text-anchor="middle" >前端／參考就緒</text><text x="300" y="579" font-size="20" fill="#2e3d59" text-anchor="middle" >0.8 ms</text><rect x="500" y="525" width="250" height="65" rx="3" fill="#c4d5e7" stroke="#607b9e" stroke-width="2" id="budget-convert" data-start-ms="0.8" data-duration-ms="0.5"/><text x="625" y="553" font-size="20" fill="#2e3d59" text-anchor="middle" >ADC 轉換</text><text x="625" y="579" font-size="20" fill="#2e3d59" text-anchor="middle" >0.5 ms</text><rect x="750" y="525" width="100" height="65" rx="3" fill="#e4eaf2" stroke="#607b9e" stroke-width="2" id="budget-store" data-start-ms="1.3" data-duration-ms="0.2"/><text x="800" y="553" font-size="20" fill="#2e3d59" text-anchor="middle" >讀存</text><text x="800" y="579" font-size="20" fill="#2e3d59" text-anchor="middle" >0.2 ms</text><rect x="850" y="525" width="250" height="65" rx="3" fill="#edaa60" stroke="#607b9e" stroke-width="2" id="budget-remaining" data-start-ms="1.5" data-duration-ms="0.5"/><text x="975" y="553" font-size="20" fill="#2e3d59" text-anchor="middle" >未分配</text><text x="975" y="579" font-size="20" fill="#2e3d59" text-anchor="middle" >0.5 ms</text><line x1="100" y1="610" x2="1100" y2="610" stroke="#2e3d59" stroke-width="2" /><line x1="100" y1="605" x2="100" y2="618" stroke="#2e3d59" stroke-width="2" /><text x="100" y="646" font-size="20" fill="#2e3d59" text-anchor="middle" >0</text><line x1="500" y1="605" x2="500" y2="618" stroke="#2e3d59" stroke-width="2" /><text x="500" y="646" font-size="20" fill="#2e3d59" text-anchor="middle" >0.8</text><line x1="750" y1="605" x2="750" y2="618" stroke="#2e3d59" stroke-width="2" /><text x="750" y="646" font-size="20" fill="#2e3d59" text-anchor="middle" >1.3</text><line x1="850" y1="605" x2="850" y2="618" stroke="#2e3d59" stroke-width="2" /><text x="850" y="646" font-size="20" fill="#2e3d59" text-anchor="middle" >1.5</text><line x1="1100" y1="605" x2="1100" y2="618" stroke="#2e3d59" stroke-width="2" /><text x="1100" y="646" font-size="20" fill="#2e3d59" text-anchor="middle" >2</text><text x="1140" y="646" font-size="20" fill="#2e3d59" text-anchor="middle" >ms</text><path d="M200 594 V681 H100" fill="none" stroke="#4c6d96" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="100" y="713" font-size="22" fill="#2e3d59" text-anchor="start" >錯誤例：0.2 ms 啟動 ADC，就緒條件尚未保證。</text><text x="100" y="754" font-size="22" fill="#2e3d59" text-anchor="start" >0.8＋0.5＋0.2＝1.5 ms；2 ms 預算尚餘 0.5 ms。</text><text x="100" y="790" font-size="20" fill="#536781" text-anchor="start" >自設上限排程，非實測；不證明耗電、精度或晶片已實現。</text></svg>
