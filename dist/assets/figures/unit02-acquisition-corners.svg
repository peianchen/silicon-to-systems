<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="u02-acq-corners-title u02-acq-corners-desc" data-figure-style="sts-flat-v1">
<title id="u02-acq-corners-title">名目通過之後：參數上界還能通過嗎？</title><desc id="u02-acq-corners-desc">線性橫軸0至600奈秒，對數縱軸0.01至10000毫伏。兩曲線為2048exp負t除以tau，tau為50和66奈秒。1毫伏門檻下，400奈秒名目0.687027毫伏通過，最慢4.777956毫伏不通過；550奈秒最慢0.492277毫伏通過。全部為自設單極點模型，非實測或良率分布。</desc>
