<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" data-figure-style="sts-flat-v1">
<title id="title">從需求到證據：模型與實測分開記錄</title><desc id="desc">自設需求P01平均電流40微安以下、S01每秒新資料、T01指定溫度點比較，經候選方案、模型、量測到逐項判定。箭頭是資訊關係，橘色虛線是修訂回饋，不代表物理製造倒流。</desc>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC","DejaVu Sans",sans-serif;fill:#2e3d59}.panel{font-size:25px;font-weight:600}.label{font-size:22px}.note{font-size:20px;fill:#536781}.badge{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#ffffff}</style>
<rect width="1200" height="620" fill="#ffffff"/>
<circle cx="55" cy="35" r="19" fill="#7185a6"/><text x="55" y="42" class="badge" text-anchor="middle">1</text><text x="88" y="43" class="panel" text-anchor="start">從需求到證據：模型與實測分開記錄</text><line x1="38" y1="66" x2="1162" y2="66" stroke="#c5cfdd" stroke-width="2" />
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2e3d59" stroke-width="1.3"/></marker><marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#b56b28" stroke-width="1.3"/></marker></defs>
<circle cx="63" cy="110" r="19" fill="#7185a6"/><text x="63" y="117" class="badge" text-anchor="middle">1</text><text x="93" y="118" class="label" text-anchor="start">需求與條件</text><rect x="40" y="150" width="250" height="300" rx="4" fill="#ffffff" stroke="#607b9e" stroke-width="2"/>
<text x="58" y="187" class="label" text-anchor="start">P01：平均耗電</text><text x="58" y="222" class="note" text-anchor="start">≤ 40 µA，完整週期</text><line x1="56" y1="250" x2="274" y2="250" stroke="#c5cfdd" stroke-width="2" /><text x="58" y="287" class="label" text-anchor="start">S01：每秒新資料</text><text x="58" y="322" class="note" text-anchor="start">檢查相鄰完成間隔</text><line x1="56" y1="350" x2="274" y2="350" stroke="#c5cfdd" stroke-width="2" /><text x="58" y="387" class="label" text-anchor="start">T01：指定點位</text><text x="58" y="422" class="note" text-anchor="start">與校正參考比較</text><line x1="296" y1="300" x2="323" y2="300" stroke="#2e3d59" stroke-width="2" marker-end="url(#arrow)"/><circle cx="353" cy="110" r="19" fill="#7185a6"/><text x="353" y="117" class="badge" text-anchor="middle">2</text><text x="383" y="118" class="label" text-anchor="start">候選方案與模型</text><rect x="330" y="150" width="250" height="300" rx="4" fill="#ffffff" stroke="#607b9e" stroke-width="2"/>
<text x="348" y="187" class="label" text-anchor="start">工作 2 ms：耗電模型</text><text x="348" y="222" class="note" text-anchor="start">預測 31.984 µA</text><line x1="346" y1="250" x2="564" y2="250" stroke="#c5cfdd" stroke-width="2" /><text x="348" y="287" class="label" text-anchor="start">S01 尚無時序證據</text><text x="348" y="322" class="note" text-anchor="start">新資料是否完成？</text><line x1="346" y1="350" x2="564" y2="350" stroke="#c5cfdd" stroke-width="2" /><text x="348" y="387" class="label" text-anchor="start">T01 尚無比較證據</text><text x="348" y="422" class="note" text-anchor="start">準確度仍須確認</text><line x1="586" y1="300" x2="613" y2="300" stroke="#2e3d59" stroke-width="2" marker-end="url(#arrow)"/><circle cx="643" cy="110" r="19" fill="#7185a6"/><text x="643" y="117" class="badge" text-anchor="middle">3</text><text x="673" y="118" class="label" text-anchor="start">原型待補的量測</text><rect x="620" y="150" width="250" height="300" rx="4" fill="#eef2f7" stroke="#607b9e" stroke-width="2"/>
<text x="638" y="187" class="label" text-anchor="start">完整電流波形</text><text x="638" y="222" class="note" text-anchor="start">保留喚醒與睡眠</text><line x1="636" y1="250" x2="854" y2="250" stroke="#c5cfdd" stroke-width="2" /><text x="638" y="287" class="label" text-anchor="start">新資料與時間戳</text><text x="638" y="322" class="note" text-anchor="start">不能重複舊值</text><line x1="636" y1="350" x2="854" y2="350" stroke="#c5cfdd" stroke-width="2" /><text x="638" y="387" class="label" text-anchor="start">指定溫度點比較</text><text x="638" y="422" class="note" text-anchor="start">條件與不確定度</text><line x1="876" y1="300" x2="903" y2="300" stroke="#2e3d59" stroke-width="2" marker-end="url(#arrow)"/><circle cx="933" cy="110" r="19" fill="#7185a6"/><text x="933" y="117" class="badge" text-anchor="middle">4</text><text x="963" y="118" class="label" text-anchor="start">逐項判定</text><rect x="910" y="150" width="250" height="300" rx="4" fill="#ffffff" stroke="#607b9e" stroke-width="2"/>
<text x="928" y="187" class="label" text-anchor="start">P01 是否符合？</text><text x="928" y="222" class="note" text-anchor="start">計算不等於實測</text><line x1="926" y1="250" x2="1144" y2="250" stroke="#c5cfdd" stroke-width="2" /><text x="928" y="287" class="label" text-anchor="start">S01 是否符合？</text><text x="928" y="322" class="note" text-anchor="start">資料必須有效</text><line x1="926" y1="350" x2="1144" y2="350" stroke="#c5cfdd" stroke-width="2" /><text x="928" y="387" class="label" text-anchor="start">T01 是否符合？</text><text x="928" y="422" class="note" text-anchor="start">限於指定條件</text><path d="M1035 462 V505 H455 V462" fill="none" stroke="#b56b28" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#feedback)"/>
<text x="745" y="541" class="note" text-anchor="middle">不符或證據不足：檢查假設、修改方案，再量測</text><text x="600" y="590" class="note" text-anchor="middle">同一硬體、韌體與工作模式；實線為資訊關係，虛線為修訂回饋。</text>
</svg>
