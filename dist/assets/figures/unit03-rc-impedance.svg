<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="775" viewBox="0 0 1200 775" role="img" aria-labelledby="u03-impedance-title u03-impedance-desc" data-figure-style="sts-flat-v1"><title id="u03-impedance-title">先定義電路，再把阻抗放到複數平面</title><desc id="u03-impedance-desc">理想1Vrms 1kHz源驅動1kΩ與100nF串聯。電流流經R進入電容上端，輸出上正下負。阻抗實部1000虛部−1591.549，兩軸每Ω0.17px，合成角−57.858度。</desc><defs><marker id="u03-impedance-ink" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#2e3d59"/></marker><marker id="u03-impedance-blue" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#4c6d96"/></marker><marker id="u03-impedance-orange" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#b56b28"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC","DejaVu Sans",sans-serif;font-variant-numeric:tabular-nums}line,path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="775" fill="#ffffff"/><text x="40" y="44" font-size="25" fill="#2e3d59" text-anchor="start">先定義電路，再把阻抗放到複數平面</text><text x="40" y="82" font-size="20" fill="#536781" text-anchor="start">理想正弦穩態；同頻率、RMS 慣例。左側電路非比例，右側兩軸等尺度。</text><line x1="600" y1="112" x2="600" y2="650" stroke="#c5cfdd" stroke-width="1.5" /><text x="65" y="150" font-size="22" fill="#2e3d59" text-anchor="start">① 串聯 RC，輸出取電容</text><text x="650" y="150" font-size="22" fill="#2e3d59" text-anchor="start">② Z = R + Z_C</text><line x1="125" y1="230" x2="220" y2="230" stroke="#2e3d59" stroke-width="2.5" /><rect x="220" y="212" width="110" height="36" fill="#c4d5e7" stroke="#2e3d59" stroke-width="2.5"/><line x1="330" y1="230" x2="465" y2="230" stroke="#2e3d59" stroke-width="2.5" /><line x1="125" y1="230" x2="125" y2="328" stroke="#2e3d59" stroke-width="2.5" /><circle cx="125" cy="365" r="37" fill="#ffffff" stroke="#2e3d59" stroke-width="2.5"/><text x="125" y="354" font-size="22" fill="#2e3d59" text-anchor="middle">+</text><text x="125" y="389" font-size="22" fill="#2e3d59" text-anchor="middle">−</text><line x1="125" y1="402" x2="125" y2="500" stroke="#2e3d59" stroke-width="2.5" /><line x1="125" y1="500" x2="465" y2="500" stroke="#2e3d59" stroke-width="2.5" /><line x1="465" y1="230" x2="465" y2="365" stroke="#2e3d59" stroke-width="2.5" /><line x1="440" y1="365" x2="490" y2="365" stroke="#2e3d59" stroke-width="2.5" /><line x1="440" y1="391" x2="490" y2="391" stroke="#2e3d59" stroke-width="2.5" /><line x1="465" y1="391" x2="465" y2="500" stroke="#2e3d59" stroke-width="2.5" /><line x1="275" y1="500" x2="275" y2="512" stroke="#2e3d59" stroke-width="2" /><line x1="257" y1="512" x2="293" y2="512" stroke="#2e3d59" stroke-width="2" /><line x1="263" y1="520" x2="287" y2="520" stroke="#2e3d59" stroke-width="2" /><line x1="269" y1="528" x2="281" y2="528" stroke="#2e3d59" stroke-width="2" /><text x="275" y="194" font-size="22" fill="#2e3d59" text-anchor="middle">R = 1 kΩ</text><text x="293" y="385" font-size="22" fill="#2e3d59" text-anchor="start">C = 100 nF</text><text x="72" y="307" font-size="22" fill="#2e3d59" text-anchor="start">V_s</text><line x1="355" y1="195" x2="430" y2="195" stroke="#4c6d96" stroke-width="2.6" marker-end="url(#u03-impedance-blue)"/><text x="392" y="180" font-size="22" fill="#4c6d96" text-anchor="middle">I</text><text x="512" y="257" font-size="22" fill="#b56b28" text-anchor="middle">+</text><text x="518" y="340" font-size="22" fill="#b56b28" text-anchor="middle">V_C</text><text x="512" y="506" font-size="22" fill="#b56b28" text-anchor="middle">−</text><text x="70" y="572" font-size="22" fill="#2e3d59" text-anchor="start">V_s = 1∠0° V RMS</text><text x="70" y="611" font-size="22" fill="#2e3d59" text-anchor="start">f = 1 kHz；V_out = V_C</text><line x1="700" y1="240" x2="1115" y2="240" stroke="#c5cfdd" stroke-width="1.5" /><line x1="750" y1="570" x2="750" y2="180" stroke="#c5cfdd" stroke-width="1.5" /><text x="1115" y="282" font-size="20" fill="#536781" text-anchor="end">Re Z（Ω）</text><text x="765" y="182" font-size="20" fill="#536781" text-anchor="start">Im Z（Ω）</text><text x="734" y="268" font-size="20" fill="#536781" text-anchor="end">0</text><line x1="744" y1="410" x2="756" y2="410" stroke="#c5cfdd" stroke-width="1.5" /><text x="732" y="417" font-size="20" fill="#536781" text-anchor="end">−1000</text><path id="u03-impedance-R" d="M750,240 L920,240" fill="none" stroke="#4c6d96" stroke-width="2.6" marker-end="url(#u03-impedance-blue)"/><path id="u03-impedance-C" d="M920,240 L920,510.563" fill="none" stroke="#b56b28" stroke-width="2.6" marker-end="url(#u03-impedance-orange)"/><path id="u03-impedance-Z" d="M750,240 L920,510.563" fill="none" stroke="#2e3d59" stroke-width="2.6" marker-end="url(#u03-impedance-ink)"/><path id="u03-impedance-angle" d="M788,240 L787.995,240.64 L787.978,241.279 L787.952,241.918 L787.914,242.556 L787.866,243.194 L787.806,243.831 L787.737,244.466 L787.656,245.101 L787.565,245.734 L787.463,246.365 L787.351,246.995 L787.228,247.623 L787.094,248.248 L786.95,248.871 L786.795,249.492 L786.631,250.11 L786.455,250.725 L786.27,251.337 L786.074,251.945 L785.867,252.551 L785.651,253.153 L785.425,253.751 L785.188,254.345 L784.942,254.935 L784.686,255.521 L784.42,256.103 L784.144,256.68 L783.858,257.252 L783.563,257.819 L783.258,258.382 L782.944,258.939 L782.621,259.49 L782.288,260.037 L781.946,260.577 L781.596,261.112 L781.236,261.641 L780.867,262.163 L780.49,262.68 L780.104,263.19 L779.709,263.693 L779.306,264.19 L778.895,264.679 L778.476,265.162 L778.048,265.638 L777.613,266.106 L777.17,266.567 L776.719,267.021 L776.26,267.467 L775.794,267.905 L775.321,268.335 L774.84,268.757 L774.353,269.171 L773.858,269.577 L773.357,269.974 L772.85,270.363 L772.335,270.743 L771.815,271.115 L771.288,271.477 L770.755,271.831 L770.217,272.176" fill="none" stroke="#b56b28" stroke-width="2.6" /><text x="835" y="212" font-size="22" fill="#4c6d96" text-anchor="middle">R = 1000 Ω</text><text x="944" y="389" font-size="22" fill="#b56b28" text-anchor="start">−j1591.55 Ω</text><text x="800" y="303" font-size="22" fill="#2e3d59" text-anchor="start">−57.86°</text><text x="1130" y="560" font-size="22" fill="#2e3d59" text-anchor="end">Z = 1000 − j1591.55 Ω</text><text x="900" y="609" font-size="22" fill="#2e3d59" text-anchor="middle">|Z| = 1879.64 Ω</text><text x="40" y="695" font-size="20" fill="#2e3d59" text-anchor="start">I = V_s/Z = 0.5320∠+57.86° mA RMS；電流超前電源電壓。</text><text x="40" y="735" font-size="20" fill="#536781" text-anchor="start">阻抗圖由計算值繪製；負虛部不代表負電阻或平均能量產生。</text></svg>
