<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1195" viewBox="0 0 1200 1195" role="img" aria-labelledby="u03-supply-impedance-title u03-supply-impedance-desc" data-figure-style="sts-flat-v1">
<title id="u03-supply-impedance-title">供電路徑：電感會改變單頻漣波判斷</title><desc id="u03-supply-impedance-desc">理想供電的交流擾動為零，經20毫歐等效電阻與迴路電感連到負載電流擾動；L包含去程與回程，不只是單一導線。電流參考從源至負載，左正右負的路徑壓降等於ZI，負載電壓擾動為負ZI。下圖雙對數座標，頻率1至100MHz、阻抗10至1000毫歐；電感1及0.5奈亨各201點按sqrt(R²+(2πfL)²)計算。10MHz阻抗分別65.938166和37.241918毫歐；0.1安培有效值與5毫伏有效值漣波給50毫歐門檻。未含去耦、VRM動態或分布參數；不是完整PDN、實測或多音峰值保證。</desc>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC","DejaVu Sans",sans-serif;font-variant-numeric:tabular-nums}</style>
