<path d="M381 624 H791 V638 H825" fill="none" stroke="#607b9e" stroke-width="1.8" stroke-linejoin="round" />
<text x="990" y="634" class="label" text-anchor="middle">FEOL：電晶體等元件</text>
<text x="990" y="662" class="note" text-anchor="middle">圖示為簡化平面結構</text>
<text x="38" y="784" class="note" text-anchor="start">概念剖面，非等比例；省略隔離等細節，非完整電路連線；MOL／BEOL 邊界依技術而異。</text>
