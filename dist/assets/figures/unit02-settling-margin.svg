<title id="title">RC 建立差：等待時間與參數容差</title><desc id="desc">自設理想RC公式計算。時間3到7毫秒，剩餘差占初終值差的百分比0到8，線性座標。藍實線時間常數1毫秒，橘虛線1.155毫秒；最慢模型在5毫秒剩1.3181%，6毫秒剩0.5545%，1%門檻交點約5.319毫秒。不是實測或信賴區間。</desc>
