<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="u03-load-title u03-load-desc" data-figure-style="sts-flat-v1"><title id="u03-load-title">增益的分母在哪裡？分清源、輸入端與負載</title><desc id="u03-load-desc">上圖理想源直接串R，輸出對回路為C。下圖Vs先串Rs至Vi，再串R至Vo；Vo並聯C與RL，虛線示可選探棒Rp並Cp。電壓對同一回路定義；有Rs時Vo/Vi與Vo/Vs不同。</desc><defs><marker id="u03-load-ink" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#2e3d59"/></marker><marker id="u03-load-blue" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#4c6d96"/></marker><marker id="u03-load-orange" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="#b56b28"/></marker></defs><style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC","DejaVu Sans",sans-serif;font-variant-numeric:tabular-nums}line,path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1040" fill="#ffffff"/><text x="40" y="44" font-size="25" fill="#2e3d59" text-anchor="start">增益的分母在哪裡？分清源、輸入端與負載</text><text x="40" y="82" font-size="20" fill="#536781" text-anchor="start">各電壓對下方參考回路定義；電路拓撲示意，不按實體尺寸。</text><text x="60" y="136" font-size="22" fill="#2e3d59" text-anchor="start">① 理想源、無額外負載</text><line x1="140" y1="200" x2="390" y2="200" stroke="#2e3d59" stroke-width="2.5" /><rect x="390" y="182" width="140" height="36" fill="#c4d5e7" stroke="#2e3d59" stroke-width="2.5"/><line x1="530" y1="200" x2="775" y2="200" stroke="#2e3d59" stroke-width="2.5" /><line x1="140" y1="200" x2="140" y2="248" stroke="#2e3d59" stroke-width="2.5" /><circle cx="140" cy="285" r="37" fill="#ffffff" stroke="#2e3d59" stroke-width="2.5"/><text x="140" y="274" font-size="22" fill="#2e3d59" text-anchor="middle">+</text><text x="140" y="309" font-size="22" fill="#2e3d59" text-anchor="middle">−</text><line x1="140" y1="322" x2="140" y2="375" stroke="#2e3d59" stroke-width="2.5" /><line x1="140" y1="375" x2="775" y2="375" stroke="#2e3d59" stroke-width="2.5" /><line x1="775" y1="200" x2="775" y2="260" stroke="#2e3d59" stroke-width="2.5" /><line x1="750" y1="260" x2="800" y2="260" stroke="#2e3d59" stroke-width="2.5" /><line x1="750" y1="286" x2="800" y2="286" stroke="#2e3d59" stroke-width="2.5" /><line x1="775" y1="286" x2="775" y2="375" stroke="#2e3d59" stroke-width="2.5" /><line x1="500" y1="375" x2="500" y2="387" stroke="#2e3d59" stroke-width="2" /><line x1="482" y1="387" x2="518" y2="387" stroke="#2e3d59" stroke-width="2" /><line x1="488" y1="395" x2="512" y2="395" stroke="#2e3d59" stroke-width="2" /><line x1="494" y1="403" x2="506" y2="403" stroke="#2e3d59" stroke-width="2" /><circle cx="290" cy="200" r="4" fill="#2e3d59"/><text x="290" y="176" font-size="22" fill="#4c6d96" text-anchor="middle">V_i = V_s</text><text x="460" y="176" font-size="22" fill="#2e3d59" text-anchor="middle">R</text><text x="87" y="248" font-size="22" fill="#2e3d59" text-anchor="start">V_s</text><text x="810" y="242" font-size="22" fill="#b56b28" text-anchor="start">+</text><text x="810" y="290" font-size="22" fill="#b56b28" text-anchor="start">V_o</text><text x="810" y="378" font-size="22" fill="#b56b28" text-anchor="start">−</text><text x="720" y="280" font-size="22" fill="#2e3d59" text-anchor="start">C</text><text x="950" y="222" font-size="22" fill="#2e3d59" text-anchor="start">R_s = 0</text><text x="950" y="264" font-size="22" fill="#2e3d59" text-anchor="start">R_L → ∞</text><text x="950" y="306" font-size="22" fill="#2e3d59" text-anchor="start">未接探棒</text><text x="60" y="433" font-size="20" fill="#2e3d59" text-anchor="start">V_o/V_i = V_o/V_s = 1/(1 + jωRC)</text><line x1="40" y1="469" x2="1160" y2="469" stroke="#c5cfdd" stroke-width="1.5" /><text x="60" y="515" font-size="22" fill="#2e3d59" text-anchor="start">② 加入源阻抗、接收端負載及可選的探棒支路</text><line x1="130" y1="580" x2="230" y2="580" stroke="#2e3d59" stroke-width="2.5" /><rect x="230" y="562" width="92" height="36" fill="#c4d5e7" stroke="#2e3d59" stroke-width="2.5"/><line x1="322" y1="580" x2="495" y2="580" stroke="#2e3d59" stroke-width="2.5" /><rect x="495" y="562" width="100" height="36" fill="#c4d5e7" stroke="#2e3d59" stroke-width="2.5"/><line x1="595" y1="580" x2="1065" y2="580" stroke="#2e3d59" stroke-width="2.5" /><line x1="130" y1="580" x2="130" y2="648" stroke="#2e3d59" stroke-width="2.5" /><circle cx="130" cy="685" r="37" fill="#ffffff" stroke="#2e3d59" stroke-width="2.5"/><text x="130" y="674" font-size="22" fill="#2e3d59" text-anchor="middle">+</text><text x="130" y="709" font-size="22" fill="#2e3d59" text-anchor="middle">−</text><line x1="130" y1="722" x2="130" y2="790" stroke="#2e3d59" stroke-width="2.5" /><line x1="130" y1="790" x2="1065" y2="790" stroke="#2e3d59" stroke-width="2.5" /><line x1="715" y1="580" x2="715" y2="680" stroke="#2e3d59" stroke-width="2.5" /><line x1="690" y1="680" x2="740" y2="680" stroke="#2e3d59" stroke-width="2.5" /><line x1="690" y1="706" x2="740" y2="706" stroke="#2e3d59" stroke-width="2.5" /><line x1="715" y1="706" x2="715" y2="790" stroke="#2e3d59" stroke-width="2.5" /><line x1="890" y1="580" x2="890" y2="649" stroke="#2e3d59" stroke-width="2.5" /><rect x="872" y="649" width="36" height="72" fill="#c4d5e7" stroke="#2e3d59" stroke-width="2.5"/><line x1="890" y1="721" x2="890" y2="790" stroke="#2e3d59" stroke-width="2.5" /><line x1="1065" y1="580" x2="1065" y2="620" stroke="#536781" stroke-width="2" stroke-dasharray="7 5"/><rect x="999" y="620" width="132" height="150" fill="#ffffff" stroke="#536781" stroke-dasharray="7 5"/><line x1="1065" y1="770" x2="1065" y2="790" stroke="#536781" stroke-width="2" stroke-dasharray="7 5"/><text x="1065" y="660" font-size="22" fill="#536781" text-anchor="middle">探棒</text><text x="1065" y="706" font-size="20" fill="#536781" text-anchor="middle">R_p ∥ C_p</text><text x="1065" y="747" font-size="20" fill="#536781" text-anchor="middle">可選支路</text><circle cx="400" cy="580" r="4" fill="#2e3d59"/><circle cx="715" cy="580" r="4" fill="#2e3d59"/><circle cx="890" cy="580" r="4" fill="#2e3d59"/><circle cx="1065" cy="580" r="4" fill="#2e3d59"/><circle cx="715" cy="790" r="4" fill="#2e3d59"/><circle cx="890" cy="790" r="4" fill="#2e3d59"/><circle cx="1065" cy="790" r="4" fill="#2e3d59"/><text x="276" y="556" font-size="22" fill="#2e3d59" text-anchor="middle">R_s</text><text x="400" y="556" font-size="22" fill="#4c6d96" text-anchor="middle">V_i</text><text x="545" y="556" font-size="22" fill="#2e3d59" text-anchor="middle">R</text><text x="715" y="556" font-size="22" fill="#b56b28" text-anchor="middle">V_o</text><text x="78" y="644" font-size="22" fill="#2e3d59" text-anchor="start">V_s</text><text x="662" y="697" font-size="22" fill="#2e3d59" text-anchor="start">C</text><text x="925" y="695" font-size="22" fill="#2e3d59" text-anchor="start">R_L</text><text x="754" y="616" font-size="22" fill="#b56b28" text-anchor="start">+</text><text x="754" y="793" font-size="22" fill="#b56b28" text-anchor="start">−</text><line x1="400" y1="790" x2="400" y2="802" stroke="#2e3d59" stroke-width="2" /><line x1="382" y1="802" x2="418" y2="802" stroke="#2e3d59" stroke-width="2" /><line x1="388" y1="810" x2="412" y2="810" stroke="#2e3d59" stroke-width="2" /><line x1="394" y1="818" x2="406" y2="818" stroke="#2e3d59" stroke-width="2" /><text x="60" y="858" font-size="20" fill="#2e3d59" text-anchor="start">未接探棒：Z_p = (1/R_L + jωC)⁻¹；接探棒後再加入其並聯導納。</text><text x="60" y="899" font-size="20" fill="#2e3d59" text-anchor="start">V_o/V_i = Z_p/(R + Z_p)；V_o/V_s = Z_p/(R_s + R + Z_p)。</text><text x="40" y="960" font-size="20" fill="#2e3d59" text-anchor="start">V_s 是源內部等效電壓；V_i 是實際輸入端。先定義增益分母，再比較數字。</text><text x="40" y="1002" font-size="20" fill="#536781" text-anchor="start">探棒的有限電阻與電容也會改變電路；高輸入電阻不代表高頻零負載。</text></svg>
